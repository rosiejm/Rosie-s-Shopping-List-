<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7dce6">
  <title>Rosie's Shopping List</title>
  <style>
    :root {
      --pink: #c66b8a;
      --pink-dark: #9f4d6b;
      --pink-light: #fff1f6;
      --cream: #fffaf7;
      --text: #3d3035;
      --muted: #77676d;
      --border: #efd3de;
      --card: rgba(255,255,255,.94);
      --shadow: 0 10px 28px rgba(111, 65, 82, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #ffeaf2 0, transparent 34%),
        linear-gradient(180deg, #fff9fb 0%, #fffdfb 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: max(18px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #f8d9e5, #fff3f7);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .subtitle { margin: 0; color: var(--muted); }
    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }
    .progress-text { font-weight: 600; }
    .progress-track {
      height: 10px;
      background: rgba(255,255,255,.8);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid var(--border);
    }
    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--pink), #df91aa);
      transition: width .25s ease;
    }
    button {
      border: 1px solid var(--border);
      background: white;
      color: var(--pink-dark);
      border-radius: 12px;
      padding: 10px 13px;
      font: inherit;
      font-weight: 600;
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin: 14px 0;
      box-shadow: var(--shadow);
    }
    .section h2 {
      margin: 0;
      padding: 13px 16px;
      background: var(--pink-light);
      font-size: 1.05rem;
    }
    .items { padding: 4px 15px 8px; }
    label {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 13px 2px;
      border-bottom: 1px solid #f3e5ea;
      font-size: 1rem;
      line-height: 1.3;
    }
    label:last-child { border-bottom: 0; }
    input[type="checkbox"] {
      appearance: none;
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border: 2px solid #d99bb1;
      border-radius: 8px;
      margin: -1px 0 0;
      background: white;
      display: grid;
      place-content: center;
    }
    input[type="checkbox"]::before {
      content: "✓";
      transform: scale(0);
      color: white;
      font-weight: 800;
      font-size: 16px;
      transition: transform .12s ease;
    }
    input[type="checkbox"]:checked {
      background: var(--pink);
      border-color: var(--pink);
    }
    input[type="checkbox"]:checked::before { transform: scale(1); }
    label.done span {
      color: #a4949a;
      text-decoration: line-through;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      padding: 10px 6px 2px;
    }
    @media (max-width: 430px) {
      h1 { font-size: 1.5rem; }
      header { padding: 17px; }
      .progress-row { align-items: flex-start; }
      button { padding: 9px 11px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 Rosie's Shopping List</h1>
    <p class="subtitle">Tap each item as it goes into your trolley.</p>
    <div class="progress-row">
      <div id="progressText" class="progress-text">0 of 47 collected</div>
      <button id="reset" type="button">Reset ticks</button>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </header>

  <main id="list"></main>

  <footer>Your ticks are saved on this iPhone.</footer>
</div>

<script>
const sections = [
  ["🥩 Meat & Fish", [
    "1 x diced chicken breast",
    "1 x chicken breast fillets",
    "250g raw king prawns",
    "1 x pack of good-quality sausages",
    "2 x packs thick-cut ham",
    "1 x pack crispy bacon"
  ]],
  ["🧀 Dairy & Chilled", [
    "2 x grated four-cheese mix",
    "1 x Parmesan",
    "2 x 300ml tubs double cream — 600ml total",
    "1 x soured cream",
    "1 x Holy Moly guacamole",
    "2 x strawberry yoghurts",
    "Butter",
    "1 x Cadbury Mini Eggs desserts"
  ]],
  ["🥔 Fruit & Vegetables", [
    "2 leeks",
    "2 white onions",
    "2 red onions",
    "2kg Maris Piper potatoes",
    "Mushrooms",
    "Courgettes",
    "Baby spinach",
    "Cotton Candy grapes",
    "Garlic",
    "1 lemon",
    "Fresh parsley"
  ]],
  ["🥖 Bakery", ["Paninis", "Crumpets", "Garlic bread"]],
  ["🥫 Cupboard", [
    "Arborio risotto rice",
    "Chicken stock cubes",
    "Small bottle of Chardonnay",
    "Mild salsa",
    "Horlicks Kids Chocolate",
    "Lemon curd"
  ]],
  ["🌮 Mexican", ["Old El Paso Enchilada Kit", "Old El Paso Nacho Kit"]],
  ["🍝 Ready Meal", ["Charlie Bigham's lasagne"]],
  ["🍫 Snacks & Treats", [
    "2 x Cadbury Dairy Milk multipacks",
    "1 x Cadbury Mini Eggs desserts",
    "4 x Walkers Cheese & Onion sharing crisps"
  ]]
];

const storageKey = "rosie-shopping-list-v1";
const state = JSON.parse(localStorage.getItem(storageKey) || "{}");
const list = document.getElementById("list");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function save() {
  localStorage.setItem(storageKey, JSON.stringify(state));
}

function updateProgress() {
  const boxes = [...document.querySelectorAll('input[type="checkbox"]')];
  const checked = boxes.filter(b => b.checked).length;
  const total = boxes.length;
  progressText.textContent = `${checked} of ${total} collected`;
  progressBar.style.width = `${total ? (checked / total) * 100 : 0}%`;
}

sections.forEach(([title, items], sectionIndex) => {
  const section = document.createElement("section");
  section.className = "section";

  const heading = document.createElement("h2");
  heading.textContent = title;
  section.appendChild(heading);

  const itemsWrap = document.createElement("div");
  itemsWrap.className = "items";

  items.forEach((item, itemIndex) => {
    const id = `${sectionIndex}-${itemIndex}`;
    const label = document.createElement("label");
    const box = document.createElement("input");
    const text = document.createElement("span");

    box.type = "checkbox";
    box.checked = Boolean(state[id]);
    text.textContent = item;
    label.classList.toggle("done", box.checked);

    box.addEventListener("change", () => {
      state[id] = box.checked;
      label.classList.toggle("done", box.checked);
      save();
      updateProgress();
    });

    label.append(box, text);
    itemsWrap.appendChild(label);
  });

  section.appendChild(itemsWrap);
  list.appendChild(section);
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("Clear all ticks?")) return;
  Object.keys(state).forEach(k => delete state[k]);
  save();
  document.querySelectorAll('input[type="checkbox"]').forEach(box => {
    box.checked = false;
    box.closest("label").classList.remove("done");
  });
  updateProgress();
});

updateProgress();
</script>
</body>
</html>
